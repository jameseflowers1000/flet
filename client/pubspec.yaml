name: flet_client
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  flet_ads:
    path: ../sdk/python/packages/flet-ads/src/flutter/flet_ads

# --FAT_CLIENT_START--
  flet_audio:
    path: ../sdk/python/packages/flet-audio/src/flutter/flet_audio

  flet_video:
    path: ../sdk/python/packages/flet-video/src/flutter/flet_video

  # --RIVE_CLIENT_START--
  # flet_rive:
  #   path: ../sdk/python/packages/flet-rive/src/flutter/flet_rive
  # --RIVE_CLIENT_END--

# --FAT_CLIENT_END--

  flet_audio_recorder:
    path: ../sdk/python/packages/flet-audio-recorder/src/flutter/flet_audio_recorder

  flet_camera:
    path: ../sdk/python/packages/flet-camera/src/flutter/flet_camera

  flet_charts:
    path: ../sdk/python/packages/flet-charts/src/flutter/flet_charts

  flet_color_pickers:
    path: ../sdk/python/packages/flet-color-pickers/src/flutter/flet_color_pickers

  flet_datatable2:
    path: ../sdk/python/packages/flet-datatable2/src/flutter/flet_datatable2

  flet_flashlight:
    path: ../sdk/python/packages/flet-flashlight/src/flutter/flet_flashlight

  flet_geolocator:
    path: ../sdk/python/packages/flet-geolocator/src/flutter/flet_geolocator

  flet_lottie:
    path: ../sdk/python/packages/flet-lottie/src/flutter/flet_lottie

  flet_map:
    path: ../sdk/python/packages/flet-map/src/flutter/flet_map

  flet_permission_handler:
    path: ../sdk/python/packages/flet-permission-handler/src/flutter/flet_permission_handler

  flet_secure_storage:
    path: ../sdk/python/packages/flet-secure-storage/src/flutter/flet_secure_storage

  flet_webview:
    path: ../sdk/python/packages/flet-webview/src/flutter/flet_webview

  flet_code_editor:
    path: ../sdk/python/packages/flet-code-editor/src/flutter/flet_code_editor

  super_sliver_list: ^0.4.1

  # Epyx custom extensions:
  flet_einput:
    path: ../sdk/python/packages/flet-einput/src/flutter/flet_einput

  flet_eslider:
    path: ../sdk/python/packages/flet-eslider/src/flutter/flet_eslider

  flet_supertab:
    path: ../sdk/python/packages/flet-supertab/src/flutter/flet_supertab

  flet_superplot:
    path: ../sdk/python/packages/flet-superplot/src/flutter/flet_superplot

  flet_agentview:
    path: ../sdk/python/packages/flet-agentview/src/flutter/flet_agentview

  flet_terminal:
    path: ../sdk/python/packages/flet-terminal/src/flutter/flet_terminal

  flet_micropython:
    path: ../sdk/python/packages/flet-micropython/src/flutter/flet_micropython

  flet_resizable_panel:
    path: ../sdk/python/packages/flet-resizable-panel/src/flutter/flet_resizable_panel

  flet_pane:
    path: ../sdk/python/packages/flet-pane/src/flutter/flet_pane

  flet_thumbnail:
    path: ../sdk/python/packages/flet-thumbnail/src/flutter/flet_thumbnail

  flet_markdown:
    path: ../sdk/python/packages/flet-markdown/src/flutter/flet_markdown

  flet_spy:
    path: ../sdk/python/packages/flet-spy/src/flutter/flet_spy

  flet_marching_ants:
    path: ../sdk/python/packages/flet-marching-ants/src/flutter/flet_marching_ants

  flet_vim_editor:
    path: ../sdk/python/packages/flet-vim-editor/src/flutter/flet_vim_editor

  flet_window_manager:
    path: ../sdk/python/packages/flet-window-manager/src/flutter/flet_window_manager

  flet_pdf_capture:
    path: ../sdk/python/packages/flet-pdf-capture/src/flutter/flet_pdf_capture

  syncfusion_flutter_core: any

  integration_test:
    sdk: flutter

dependency_overrides:
  flet:
    path: ../packages/flet
  # connectivity_plus 7.1.1 uses NWPath.isUltraConstrained (macOS 26 SDK);
  # pin until local Xcode ships that SDK.
  connectivity_plus: 7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^1.0.0

  # Docs: https://pub.dev/packages/flutter_launcher_icons
  flutter_launcher_icons: "^0.14.4"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/epyx-logo.png
    - assets/epyx-logo-neon.png
    - assets/epyx-anim-base.png
    - assets/epyx-glow-e.png
    - assets/epyx-glow-p.png
    - assets/epyx-glow-y.png
    - assets/epyx-glow-x.png
    - assets/epyx-glow-dot.png
    - assets/epyx-glow-a.png
    - assets/epyx-glow-i.png
    - assets/Orch.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # Bundled fonts. Flutter web does NOT honor CSS generic family names
  # ('monospace', 'serif', 'sans-serif') — fallback resolution is browser-
  # dependent and Roboto wins by default. We bundle the exact family names
  # 'monospace' and 'Courier' so user code that asks for either gets a real
  # fixed-width face.
  fonts:
    - family: monospace
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
    - family: Courier
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/flet-ios-1024.png"
  image_path_android: "assets/icon/flet-android-192.png"
