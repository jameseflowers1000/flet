<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Epyx — interactive documents">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "/canvaskit/",
      pyodideUrl: "/pyodide/pyodide.js",
      webRenderer: "auto",
      fontFallbackBaseUrl: "assets/fonts/", // for Noto Emoji, use Google CDN
      appPackageUrl: "app.tar.gz"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
      if (flet.multiView) {
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-1'),
          initialData: {
            script: 'print("Hello from view 1")',
            randomValue: Math.floor(Math.random() * 100),
          },
          viewConstraints: {
            //maxWidth: Infinity,
            maxHeight: Infinity,
            minHeight: 300,
            minWidth: 620
          }
        }));
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-2'),
          initialData: {
            script: 'print("Hello from view 2")',
            bar: "baz"
          },
          viewConstraints: {
            minWidth: 620,
            //maxWidth: 320,
            //minHeight: 400,
            maxHeight: 400,
          }
        }));
      }
    });
  </script>

  <!-- fletAppConfig -->

  <script src="python.js"></script>

</head>

<body>
  <div id="loading">
    <style>
      body {
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
        position: fixed;
      }


      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        opacity: .66;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      #loading.init_done img {
        animation: .33s ease-in-out 0s 1 forwards zooooom;
        opacity: .05;
      }

      @keyframes breathe {
        from {
          transform: scale(0.4);
          opacity: 1.0;
        }

        to {
          transform: scale(0.35);
          opacity: .7;
        }
      }

      @keyframes zooooom {
        from {
          transform: scale(0.4)
        }

        to {
          transform: scale(10)
        }
      }
    </style>
    <img src="icons/loading-animation.png" alt="Loading..." />
  </div>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Fix: Flutter web platform views (WebView iframes) capture pointer events
    // at the browser DOM level, breaking drag gestures (flutter#134652).
    // Iframes must also be disabled when behind other Flutter widgets (e.g.
    // Agent layer) because platform views sit ABOVE the Canvas in the DOM.
    //
    // Two mechanisms:
    // 1. Drag protection: pointerdown → blanket none, pointerup → re-enable per iframeStates
    // 2. Per-iframe interactive flag: Dart calls _epyxSetIframeInteractive(controlId, bool)
    //    to control individual iframes via data-flet-id attributes.
    //
    // Per-iframe targeting: each iframe is tagged with data-flet-id by Dart.
    // The iframeStates registry tracks {controlId: bool} for each WebView.
    // Backward compat: if controlId is a boolean (old call pattern), falls back to blanket.
    (function() {
      var dragging = false;
      var iframeStates = {};  // { controlId: bool } — per-iframe interactive state
      var blanketAllowed = true;  // Legacy fallback for old boolean API

      // Find an iframe by its data-flet-id, searching document + shadow roots
      function findIframeByControlId(controlId) {
        var sel = '[data-flet-id="' + controlId + '"]';
        function searchRoot(root) {
          // Check iframes directly
          var el = root.querySelector('iframe' + sel);
          if (el) return el;
          // Check flt-platform-view containers that have the attribute
          var pv = root.querySelector('flt-platform-view' + sel);
          if (pv) {
            var iframe = pv.querySelector('iframe');
            if (iframe) return iframe;
          }
          return null;
        }
        var found = searchRoot(document);
        if (found) return found;
        var views = document.querySelectorAll('flutter-view, flt-glass-pane');
        for (var i = 0; i < views.length; i++) {
          if (views[i].shadowRoot) {
            found = searchRoot(views[i].shadowRoot);
            if (found) return found;
          }
        }
        return null;
      }

      // Apply pointer-events to a specific iframe by controlId
      function applyIframeState(controlId) {
        var allowed = iframeStates[controlId];
        var pe = allowed ? 'auto' : 'none';
        var iframe = findIframeByControlId(controlId);
        if (iframe) {
          iframe.style.setProperty('pointer-events', pe, 'important');
          // Also set on parent flt-platform-view
          if (iframe.parentElement && iframe.parentElement.tagName === 'FLT-PLATFORM-VIEW') {
            iframe.parentElement.style.setProperty('pointer-events', pe, 'important');
          }
        }
      }

      // Set ALL iframes to a pointer-events value (used during drag)
      function setAllIframePointerEvents(value) {
        function applyToRoot(root) {
          root.querySelectorAll('flt-platform-view, flt-platform-view iframe, iframe').forEach(function(el) {
            el.style.setProperty('pointer-events', value, 'important');
          });
        }
        applyToRoot(document);
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) applyToRoot(el.shadowRoot);
        });
      }

      // Re-apply all per-iframe states (called after drag ends)
      function reapplyAllStates() {
        var ids = Object.keys(iframeStates);
        if (ids.length === 0) {
          // No per-iframe states — use blanket
          setAllIframePointerEvents(blanketAllowed ? 'auto' : 'none');
          return;
        }
        for (var i = 0; i < ids.length; i++) {
          applyIframeState(ids[i]);
        }
      }

      function blurIframe(controlId) {
        var iframe = findIframeByControlId(controlId);
        if (iframe) iframe.blur();
      }

      function blurAllIframes() {
        function blurInRoot(root) {
          root.querySelectorAll('iframe').forEach(function(el) { el.blur(); });
        }
        blurInRoot(document);
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) blurInRoot(el.shadowRoot);
        });
      }

      // API for Dart: control whether a specific iframe should receive pointer events.
      // Called from webview_web.dart when the 'interactive' property changes.
      // Backward compat: if controlId is boolean, fall back to blanket behavior.
      window._epyxSetIframeInteractive = function(controlId, allowed) {
        if (typeof controlId === 'boolean') {
          // Legacy blanket API: _epyxSetIframeInteractive(bool)
          blanketAllowed = controlId;
          setAllIframePointerEvents(blanketAllowed ? 'auto' : 'none');
          if (!blanketAllowed) blurAllIframes();
          return;
        }
        iframeStates[controlId] = !!allowed;
        if (!dragging) {
          applyIframeState(controlId);
        }
        if (!allowed) blurIframe(controlId);
      };

      // Host-app shortcuts: intercept at document capture so an iframe
      // (ttyd / WebView) with focus doesn't swallow them and the system
      // doesn't beep "unhandled key". Cmd-E (editor) / Cmd-Z (undo) /
      // Cmd-; (next pane) / Cmd-Shift-; (prev pane) / Cmd-Backspace
      // (prev pane) all fire host-side handlers in
      // epyx.core.main:_on_keyboard via the Flutter page-key path. We
      // stop the browser default (Cmd-J would open Downloads, etc.)
      // and clear iframe focus so HardwareKeyboard sees the event.
      function _epyxShouldHandleHostShortcut(ev) {
        if (!ev) return false;
        if (!(ev.metaKey || ev.ctrlKey)) return false;
        if (ev.altKey) return false;
        var key = ev.key || '';
        var ku = key.toUpperCase();
        var isPaneNav = (key === ';' || key === ':' || key === 'Backspace');
        var isEditor = (ku === 'E') && !ev.shiftKey;
        return isPaneNav || isEditor;
      }
      function _epyxHandleHostShortcut(ev) {
        if (!_epyxShouldHandleHostShortcut(ev)) return;
        try {
          if (window.parent && window.parent !== window
              && window.parent._epyxDispatchSyntheticKey) {
            // We're inside an iframe — forward the keystroke up to the
            // parent (Flet page) so its HardwareKeyboard handler can
            // route it to the Python `_on_keyboard`. parent.focus() is
            // not enough because Flutter's keyboard listener is at
            // document level, not window-focus level.
            window.parent._epyxDispatchSyntheticKey({
              key: ev.key, code: ev.code,
              metaKey: ev.metaKey, ctrlKey: ev.ctrlKey,
              shiftKey: ev.shiftKey, altKey: ev.altKey
            });
          }
        } catch (e) {}
        try { ev.preventDefault(); } catch (e) {}
        try { ev.stopPropagation(); } catch (e) {}
      }
      document.addEventListener('keydown', function(ev) {
        if (!_epyxShouldHandleHostShortcut(ev)) return;
        if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
          try { document.activeElement.blur(); } catch (e) {}
        }
        try { ev.preventDefault(); } catch (e) {}
        try { ev.stopPropagation(); } catch (e) {}
      }, true);

      // Synthesize a KeyboardEvent on the top document so Flutter's
      // HardwareKeyboard listener picks it up. Called from inside same-
      // origin iframes via window.parent._epyxDispatchSyntheticKey.
      window._epyxDispatchSyntheticKey = function(detail) {
        try {
          var ev = new KeyboardEvent('keydown', {
            key: detail.key, code: detail.code,
            metaKey: !!detail.metaKey, ctrlKey: !!detail.ctrlKey,
            shiftKey: !!detail.shiftKey, altKey: !!detail.altKey,
            bubbles: true, cancelable: true
          });
          document.dispatchEvent(ev);
        } catch (e) {}
      };

      // Install the same capture listener inside every same-origin
      // iframe's contentDocument. Without this, a keystroke that
      // originates inside the iframe (xterm.js in ttyd, WebView pages)
      // never reaches the parent document's keydown — system beeps
      // and we can't preventDefault. Re-install on load events as
      // iframes refresh.
      function _epyxInjectIframeListener(iframe) {
        try {
          var idoc = iframe.contentDocument;
          if (!idoc) return;
          if (idoc._epyxHostShortcutsInstalled) return;
          idoc._epyxHostShortcutsInstalled = true;
          idoc.addEventListener('keydown', _epyxHandleHostShortcut, true);
        } catch (e) {
          // cross-origin iframe — can't inject. Best we can do is
          // preventDefault at parent level when focus returns.
        }
      }
      function _epyxScanIframes() {
        function scan(root) {
          root.querySelectorAll('iframe').forEach(_epyxInjectIframeListener);
        }
        try {
          scan(document);
          document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
            if (el.shadowRoot) scan(el.shadowRoot);
          });
        } catch (e) {}
      }
      // Scan now, on every DOM mutation, and periodically as a fallback.
      _epyxScanIframes();
      new MutationObserver(_epyxScanIframes).observe(document.documentElement,
          { childList: true, subtree: true });
      setInterval(_epyxScanIframes, 2000);

      // Banner DOM mirror — Dart calls _epyxSetBanner(message, level) when
      // a banner command fires. Tests read window._epyxLastBanner OR the
      // hidden DIV `#epyx-last-banner` (so document.body.innerText finds it).
      window._epyxLastBanner = null;
      // Rolling history of the last 50 banners — survives DevTools page
      // reloads of the console, lets users debug α on_key handlers
      // without trying to read the truncated on-canvas toast UI.
      // Read with `window._epyxBannerLog` in DevTools console; clear
      // with `window._epyxClearBannerLog()`.
      window._epyxBannerLog = [];
      window._epyxClearBannerLog = function() { window._epyxBannerLog = []; };
      window._epyxSetBanner = function(message, level) {
        try {
          var msg = String(message || '');
          var lvl = String(level || 'info');
          var ts = Date.now();
          window._epyxLastBanner = { message: msg, level: lvl, ts: ts };
          // Append to rolling log; cap at 50 entries.
          window._epyxBannerLog.push({ message: msg, level: lvl, ts: ts });
          if (window._epyxBannerLog.length > 50) {
            window._epyxBannerLog.shift();
          }
          // Mirror to console for live tail — DevTools shows the FULL
          // message, no truncation. Tag with 🔔 so it's easy to filter.
          try {
            var fn = (lvl === 'error') ? console.error
                   : (lvl === 'warn')  ? console.warn
                                       : console.log;
            fn.call(console, '🔔 [α banner ' + lvl + ']', msg);
          } catch (e) {}
          var div = document.getElementById('epyx-last-banner');
          if (!div) {
            div = document.createElement('div');
            div.id = 'epyx-last-banner';
            // Visible to innerText scans but not to users (off-screen).
            div.style.position = 'absolute';
            div.style.left = '-9999px';
            div.style.top = '-9999px';
            div.style.width = '1px';
            div.style.height = '1px';
            div.style.overflow = 'hidden';
            div.setAttribute('data-testid', 'epyx-banner');
            document.body.appendChild(div);
          }
          div.textContent = msg;
          div.setAttribute('data-banner-level', lvl);
        } catch (e) {}
      };
      // ETab grid selection mirror — Dart calls _epyxSetGridSelection(
      // controlId, row, col) when the focused cell changes. Tests poll
      // window._epyxLastGridSelection or read the data-* attributes on
      // the hidden #epyx-last-grid-sel div.
      window._epyxLastGridSelection = null;
      window._epyxSetGridSelection = function(controlId, row, col) {
        try {
          window._epyxLastGridSelection = {
            controlId: String(controlId || ''),
            row: Number(row),
            col: Number(col),
            ts: Date.now(),
          };
          var div = document.getElementById('epyx-last-grid-sel');
          if (!div) {
            div = document.createElement('div');
            div.id = 'epyx-last-grid-sel';
            div.style.position = 'absolute';
            div.style.left = '-9999px';
            div.style.top = '-9999px';
            div.style.width = '1px';
            div.style.height = '1px';
            div.style.overflow = 'hidden';
            div.setAttribute('data-testid', 'epyx-grid-sel');
            document.body.appendChild(div);
          }
          div.setAttribute('data-grid-row', String(row));
          div.setAttribute('data-grid-col', String(col));
          div.setAttribute('data-grid-control', String(controlId || ''));
          div.textContent = 'grid_sel ' + controlId + ' ' + row + ' ' + col;
        } catch (e) {}
      };

      // Beep DOM mirror — increments a counter on each beep so tests can
      // poll for it.
      window._epyxBeepCount = 0;
      window._epyxBeep = function() {
        try {
          window._epyxBeepCount = (window._epyxBeepCount || 0) + 1;
          var div = document.getElementById('epyx-last-beep');
          if (!div) {
            div = document.createElement('div');
            div.id = 'epyx-last-beep';
            div.style.position = 'absolute';
            div.style.left = '-9999px';
            div.style.top = '-9999px';
            div.style.width = '1px';
            div.style.height = '1px';
            div.style.overflow = 'hidden';
            div.setAttribute('data-testid', 'epyx-beep');
            document.body.appendChild(div);
          }
          div.setAttribute('data-beep-count', String(window._epyxBeepCount));
          div.textContent = 'beep ' + window._epyxBeepCount;
        } catch (e) {}
      };

      // Focus a specific iframe by controlId for keyboard input.
      // Backward compat: if no args, focus first iframe found.
      window._epyxFocusIframe = function(controlId) {
        if (controlId && typeof controlId === 'string') {
          var iframe = findIframeByControlId(controlId);
          if (iframe) { iframe.focus(); return; }
        }
        // Fallback: focus first iframe
        function tryFocus(root) {
          var iframe = root.querySelector('iframe');
          if (iframe) { iframe.focus(); return true; }
          return false;
        }
        if (tryFocus(document)) return;
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) tryFocus(el.shadowRoot);
        });
      };

      // On pointerdown: blanket-disable ALL iframes so drags work
      document.addEventListener('pointerdown', function() {
        if (!dragging) {
          dragging = true;
          setAllIframePointerEvents('none');
        }
      }, true);

      // On pointerup: re-enable per iframeStates registry
      document.addEventListener('pointerup', function() {
        if (dragging) {
          dragging = false;
          reapplyAllStates();
        }
      }, true);

      // Also handle pointer cancel (e.g. touch cancel)
      document.addEventListener('pointercancel', function() {
        if (dragging) {
          dragging = false;
          reapplyAllStates();
        }
      }, true);

      // Suppress browser right-click menu so Flutter onSecondaryTapUp fires
      document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
      });

      // MutationObserver: new iframes check iframeStates for matching controlId
      function observeRoot(root) {
        new MutationObserver(function(mutations) {
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
              if (node.nodeType !== 1) return;
              // Grant clipboard permissions to iframes
              if (node.tagName === 'IFRAME') {
                node.setAttribute('allow', 'clipboard-read; clipboard-write');
              }
              if (node.querySelectorAll) {
                node.querySelectorAll('iframe').forEach(function(el) {
                  el.setAttribute('allow', 'clipboard-read; clipboard-write');
                });
              }
              if (!dragging && (node.tagName === 'FLT-PLATFORM-VIEW' || node.tagName === 'IFRAME')) {
                // Check if this node has a data-flet-id and apply per-iframe state
                var fletId = node.getAttribute && node.getAttribute('data-flet-id');
                if (fletId && iframeStates.hasOwnProperty(fletId)) {
                  var pe = iframeStates[fletId] ? 'auto' : 'none';
                  node.style.setProperty('pointer-events', pe, 'important');
                  if (node.querySelectorAll) {
                    node.querySelectorAll('iframe').forEach(function(el) {
                      el.style.setProperty('pointer-events', pe, 'important');
                    });
                  }
                } else {
                  // No specific state — check child iframes for data-flet-id
                  if (node.querySelectorAll) {
                    node.querySelectorAll('iframe[data-flet-id]').forEach(function(el) {
                      var id = el.getAttribute('data-flet-id');
                      if (id && iframeStates.hasOwnProperty(id)) {
                        el.style.setProperty('pointer-events',
                          iframeStates[id] ? 'auto' : 'none', 'important');
                      }
                    });
                  }
                  // Fallback: use blanket state for untagged iframes
                  var pe = blanketAllowed ? 'auto' : 'none';
                  if (!fletId) {
                    node.style.setProperty('pointer-events', pe, 'important');
                    if (node.querySelectorAll) {
                      node.querySelectorAll('iframe:not([data-flet-id])').forEach(function(el) {
                        el.style.setProperty('pointer-events', pe, 'important');
                      });
                    }
                  }
                }
              }
              if (node.shadowRoot) observeRoot(node.shadowRoot);
            });
          });
        }).observe(root, { childList: true, subtree: true });
      }

      // Grant clipboard permissions on all existing iframes in a root.
      function setIframeClipboardPermissions(root) {
        root.querySelectorAll('iframe').forEach(function(el) {
          el.setAttribute('allow', 'clipboard-read; clipboard-write');
        });
      }

      function tryStart() {
        reapplyAllStates();
        setIframeClipboardPermissions(document);
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) {
            observeRoot(el.shadowRoot);
            setIframeClipboardPermissions(el.shadowRoot);
          }
        });
        observeRoot(document.body);
      }

      setTimeout(tryStart, 1000);
    })();
  </script>
