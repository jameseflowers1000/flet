  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
      if (flet.multiView) {
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-1'),
          initialData: {
            script: 'print("Hello from view 1")',
            randomValue: Math.floor(Math.random() * 100),
          },
          viewConstraints: {
            //maxWidth: Infinity,
            maxHeight: Infinity,
            minHeight: 300,
            minWidth: 620
          }
        }));
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-2'),
          initialData: {
            script: 'print("Hello from view 2")',
            bar: "baz"
          },
          viewConstraints: {
            minWidth: 620,
            //maxWidth: 320,
            //minHeight: 400,
            maxHeight: 400,
          }
        }));
      }
    });
  </script>

<body>
  <div id="loading">
    <style>
      body {
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
        position: fixed;
      }


      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        opacity: .66;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      #loading.init_done img {
        animation: .33s ease-in-out 0s 1 forwards zooooom;
        opacity: .05;
      }

      @keyframes breathe {
        from {
          transform: scale(0.4);
          opacity: 1.0;
        }

        to {
          transform: scale(0.35);
          opacity: .7;
        }
      }

      @keyframes zooooom {
        from {
          transform: scale(0.4)
        }

        to {
          transform: scale(10)
        }
      }
    </style>
    <img src="icons/loading-animation.png" alt="Loading..." />
  </div>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Fix: Flutter web platform views (WebView iframes) capture pointer events,
    // breaking drag gestures. FLT-GLASS-PANE uses a shadow DOM so parent CSS
    // cannot reach these elements. We inject inline pointer-events:none directly
    // and use MutationObserver for dynamically added platform views.
    (function() {
      function disablePointerEvents(el) {
        el.style.setProperty('pointer-events', 'none', 'important');
      }

      function scanAndDisable(root) {
        root.querySelectorAll('flt-platform-view, flt-platform-view iframe, iframe').forEach(disablePointerEvents);
      }

      function observeRoot(root) {
        new MutationObserver(function(mutations) {
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
              if (node.nodeType !== 1) return;
              if (node.tagName === 'FLT-PLATFORM-VIEW' || node.tagName === 'IFRAME') {
                disablePointerEvents(node);
                if (node.querySelectorAll) {
                  node.querySelectorAll('iframe').forEach(disablePointerEvents);
                }
              }
              if (node.shadowRoot) { scanAndDisable(node.shadowRoot); observeRoot(node.shadowRoot); }
              if (node.querySelectorAll) { scanAndDisable(node); }
            });
          });
        }).observe(root, { childList: true, subtree: true });
      }

      function tryStart() {
        if (document.querySelectorAll('flt-platform-view, iframe').length > 0) {
          scanAndDisable(document);
          document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
            if (el.shadowRoot) { scanAndDisable(el.shadowRoot); observeRoot(el.shadowRoot); }
          });
          observeRoot(document.body);
        } else {
          setTimeout(tryStart, 500);
        }
      }

      setTimeout(tryStart, 1000);
    })();
  </script>
