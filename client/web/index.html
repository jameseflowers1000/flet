  <script>
    var flet = {
      pyodide: false,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/",
      assetBase: "/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "/canvaskit/",
      pyodideUrl: "/pyodide/pyodide.js",
      webRenderer: "auto",
      fontFallbackBaseUrl: "assets/fonts/", // for Noto Emoji, use Google CDN
      appPackageUrl: "app.tar.gz"
    }

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
      if (flet.multiView) {
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-1'),
          initialData: {
            script: 'print("Hello from view 1")',
            randomValue: Math.floor(Math.random() * 100),
          },
          viewConstraints: {
            //maxWidth: Infinity,
            maxHeight: Infinity,
            minHeight: 300,
            minWidth: 620
          }
        }));
        console.log(flutterApp.addView({
          hostElement: document.querySelector('#view-2'),
          initialData: {
            script: 'print("Hello from view 2")',
            bar: "baz"
          },
          viewConstraints: {
            minWidth: 620,
            //maxWidth: 320,
            //minHeight: 400,
            maxHeight: 400,
          }
        }));
      }
    });
  </script>

<body>
  <div id="loading">
    <style>
      body {
        inset: 0;
        overflow: hidden;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
        position: fixed;
      }


      #loading {
        align-items: center;
        display: flex;
        height: 100%;
        justify-content: center;
        width: 100%;
      }

      #loading img {
        animation: 1s ease-in-out 0s infinite alternate breathe;
        opacity: .66;
        transition: opacity .4s;
      }

      #loading.main_done img {
        opacity: 1;
      }

      #loading.init_done img {
        animation: .33s ease-in-out 0s 1 forwards zooooom;
        opacity: .05;
      }

      @keyframes breathe {
        from {
          transform: scale(0.4);
          opacity: 1.0;
        }

        to {
          transform: scale(0.35);
          opacity: .7;
        }
      }

      @keyframes zooooom {
        from {
          transform: scale(0.4)
        }

        to {
          transform: scale(10)
        }
      }
    </style>
    <img src="icons/loading-animation.png" alt="Loading..." />
  </div>
  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Fix: Flutter web platform views (WebView iframes) capture pointer events
    // at the browser DOM level, breaking drag gestures (flutter#134652).
    // Iframes must also be disabled when behind other Flutter widgets (e.g.
    // Agent layer) because platform views sit ABOVE the Canvas in the DOM.
    //
    // Two mechanisms:
    // 1. Drag protection: pointerdown → blanket none, pointerup → re-enable per iframeStates
    // 2. Per-iframe interactive flag: Dart calls _epyxSetIframeInteractive(controlId, bool)
    //    to control individual iframes via data-flet-id attributes.
    //
    // Per-iframe targeting: each iframe is tagged with data-flet-id by Dart.
    // The iframeStates registry tracks {controlId: bool} for each WebView.
    // Backward compat: if controlId is a boolean (old call pattern), falls back to blanket.
    (function() {
      var dragging = false;
      var iframeStates = {};  // { controlId: bool } — per-iframe interactive state
      var blanketAllowed = true;  // Legacy fallback for old boolean API

      // Find an iframe by its data-flet-id, searching document + shadow roots
      function findIframeByControlId(controlId) {
        var sel = '[data-flet-id="' + controlId + '"]';
        function searchRoot(root) {
          // Check iframes directly
          var el = root.querySelector('iframe' + sel);
          if (el) return el;
          // Check flt-platform-view containers that have the attribute
          var pv = root.querySelector('flt-platform-view' + sel);
          if (pv) {
            var iframe = pv.querySelector('iframe');
            if (iframe) return iframe;
          }
          return null;
        }
        var found = searchRoot(document);
        if (found) return found;
        var views = document.querySelectorAll('flutter-view, flt-glass-pane');
        for (var i = 0; i < views.length; i++) {
          if (views[i].shadowRoot) {
            found = searchRoot(views[i].shadowRoot);
            if (found) return found;
          }
        }
        return null;
      }

      // Apply pointer-events to a specific iframe by controlId
      function applyIframeState(controlId) {
        var allowed = iframeStates[controlId];
        var pe = allowed ? 'auto' : 'none';
        var iframe = findIframeByControlId(controlId);
        if (iframe) {
          iframe.style.setProperty('pointer-events', pe, 'important');
          // Also set on parent flt-platform-view
          if (iframe.parentElement && iframe.parentElement.tagName === 'FLT-PLATFORM-VIEW') {
            iframe.parentElement.style.setProperty('pointer-events', pe, 'important');
          }
        }
      }

      // Set ALL iframes to a pointer-events value (used during drag)
      function setAllIframePointerEvents(value) {
        function applyToRoot(root) {
          root.querySelectorAll('flt-platform-view, flt-platform-view iframe, iframe').forEach(function(el) {
            el.style.setProperty('pointer-events', value, 'important');
          });
        }
        applyToRoot(document);
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) applyToRoot(el.shadowRoot);
        });
      }

      // Re-apply all per-iframe states (called after drag ends)
      function reapplyAllStates() {
        var ids = Object.keys(iframeStates);
        if (ids.length === 0) {
          // No per-iframe states — use blanket
          setAllIframePointerEvents(blanketAllowed ? 'auto' : 'none');
          return;
        }
        for (var i = 0; i < ids.length; i++) {
          applyIframeState(ids[i]);
        }
      }

      function blurIframe(controlId) {
        var iframe = findIframeByControlId(controlId);
        if (iframe) iframe.blur();
      }

      function blurAllIframes() {
        function blurInRoot(root) {
          root.querySelectorAll('iframe').forEach(function(el) { el.blur(); });
        }
        blurInRoot(document);
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) blurInRoot(el.shadowRoot);
        });
      }

      // API for Dart: control whether a specific iframe should receive pointer events.
      // Called from webview_web.dart when the 'interactive' property changes.
      // Backward compat: if controlId is boolean, fall back to blanket behavior.
      window._epyxSetIframeInteractive = function(controlId, allowed) {
        if (typeof controlId === 'boolean') {
          // Legacy blanket API: _epyxSetIframeInteractive(bool)
          blanketAllowed = controlId;
          setAllIframePointerEvents(blanketAllowed ? 'auto' : 'none');
          if (!blanketAllowed) blurAllIframes();
          return;
        }
        iframeStates[controlId] = !!allowed;
        if (!dragging) {
          applyIframeState(controlId);
        }
        if (!allowed) blurIframe(controlId);
      };

      // Focus a specific iframe by controlId for keyboard input.
      // Backward compat: if no args, focus first iframe found.
      window._epyxFocusIframe = function(controlId) {
        if (controlId && typeof controlId === 'string') {
          var iframe = findIframeByControlId(controlId);
          if (iframe) { iframe.focus(); return; }
        }
        // Fallback: focus first iframe
        function tryFocus(root) {
          var iframe = root.querySelector('iframe');
          if (iframe) { iframe.focus(); return true; }
          return false;
        }
        if (tryFocus(document)) return;
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) tryFocus(el.shadowRoot);
        });
      };

      // On pointerdown: blanket-disable ALL iframes so drags work
      document.addEventListener('pointerdown', function() {
        if (!dragging) {
          dragging = true;
          setAllIframePointerEvents('none');
        }
      }, true);

      // On pointerup: re-enable per iframeStates registry
      document.addEventListener('pointerup', function() {
        if (dragging) {
          dragging = false;
          reapplyAllStates();
        }
      }, true);

      // Also handle pointer cancel (e.g. touch cancel)
      document.addEventListener('pointercancel', function() {
        if (dragging) {
          dragging = false;
          reapplyAllStates();
        }
      }, true);

      // MutationObserver: new iframes check iframeStates for matching controlId
      function observeRoot(root) {
        new MutationObserver(function(mutations) {
          mutations.forEach(function(m) {
            m.addedNodes.forEach(function(node) {
              if (node.nodeType !== 1) return;
              // Grant clipboard permissions to iframes
              if (node.tagName === 'IFRAME') {
                node.setAttribute('allow', 'clipboard-read; clipboard-write');
              }
              if (node.querySelectorAll) {
                node.querySelectorAll('iframe').forEach(function(el) {
                  el.setAttribute('allow', 'clipboard-read; clipboard-write');
                });
              }
              if (!dragging && (node.tagName === 'FLT-PLATFORM-VIEW' || node.tagName === 'IFRAME')) {
                // Check if this node has a data-flet-id and apply per-iframe state
                var fletId = node.getAttribute && node.getAttribute('data-flet-id');
                if (fletId && iframeStates.hasOwnProperty(fletId)) {
                  var pe = iframeStates[fletId] ? 'auto' : 'none';
                  node.style.setProperty('pointer-events', pe, 'important');
                  if (node.querySelectorAll) {
                    node.querySelectorAll('iframe').forEach(function(el) {
                      el.style.setProperty('pointer-events', pe, 'important');
                    });
                  }
                } else {
                  // No specific state — check child iframes for data-flet-id
                  if (node.querySelectorAll) {
                    node.querySelectorAll('iframe[data-flet-id]').forEach(function(el) {
                      var id = el.getAttribute('data-flet-id');
                      if (id && iframeStates.hasOwnProperty(id)) {
                        el.style.setProperty('pointer-events',
                          iframeStates[id] ? 'auto' : 'none', 'important');
                      }
                    });
                  }
                  // Fallback: use blanket state for untagged iframes
                  var pe = blanketAllowed ? 'auto' : 'none';
                  if (!fletId) {
                    node.style.setProperty('pointer-events', pe, 'important');
                    if (node.querySelectorAll) {
                      node.querySelectorAll('iframe:not([data-flet-id])').forEach(function(el) {
                        el.style.setProperty('pointer-events', pe, 'important');
                      });
                    }
                  }
                }
              }
              if (node.shadowRoot) observeRoot(node.shadowRoot);
            });
          });
        }).observe(root, { childList: true, subtree: true });
      }

      // Grant clipboard permissions on all existing iframes in a root.
      function setIframeClipboardPermissions(root) {
        root.querySelectorAll('iframe').forEach(function(el) {
          el.setAttribute('allow', 'clipboard-read; clipboard-write');
        });
      }

      function tryStart() {
        reapplyAllStates();
        setIframeClipboardPermissions(document);
        document.querySelectorAll('flutter-view, flt-glass-pane').forEach(function(el) {
          if (el.shadowRoot) {
            observeRoot(el.shadowRoot);
            setIframeClipboardPermissions(el.shadowRoot);
          }
        });
        observeRoot(document.body);
      }

      setTimeout(tryStart, 1000);
    })();
  </script>
