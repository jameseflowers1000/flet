name: flet_agentview
description: AI Agent chat view with custom Dart widget
version: 0.2.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  flet:
    path: ../../../../../../../packages/flet

  # Explicit deps for markdown rendering in chat bubbles
  # (also available transitively from flet, but listed for clarity)
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.0
  highlight: ^0.7.0
