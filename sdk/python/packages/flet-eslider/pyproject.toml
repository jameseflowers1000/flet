[project]
name = "flet-eslider"
version = "0.1.0"
description = "Custom slider control for Flet with focus, type-to-replace, and on_key scripting"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Epyx contributors", email = "you@example.com" }
]
dependencies = [
    "flet",
]

[tool.setuptools.package-data]
"flutter.flet_eslider" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
