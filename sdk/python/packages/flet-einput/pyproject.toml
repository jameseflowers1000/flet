[project]
name = "flet-einput"
version = "0.1.0"
description = "Custom input controls (text, slider) for Flet with client-side on_key_code keyboard scripting"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Epyx contributors", email = "you@example.com" }
]
dependencies = [
    "flet",
]

[tool.setuptools.package-data]
"flutter.flet_einput" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
