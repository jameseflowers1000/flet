[project]
name = "flet-window-manager"
version = "0.1.0"
description = "Floating window manager for Flet - 60fps drag/resize with zero WebSocket traffic"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet contributors", email = "hello@flet.dev" }
]
dependencies = [
    "flet",
]

[dependency-groups]
dev = [
    "flet[all]",
    "pytest",
]

[project.urls]
Homepage = "https://flet.dev"
Repository = "https://github.com/flet-dev/flet"

[tool.setuptools.package-data]
"flutter.flet_window_manager" = ["**/*"]

[tool.setuptools]
license-files = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
